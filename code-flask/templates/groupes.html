{% extends "base.html" %} {% block title %}Groupes - Partage de frais{% endblock
%} {% block content %}

<h1>Groupes</h1>

{% if erreur %}
<article class="error-message" role="alert">{{ erreur }}</article>
{% endif %}

<section>
  <h2>Groupes existants</h2>

  {% if groupes %}
  <div class="table-container">
    <figure>
      <table>
        <thead>
          <tr>
            <th>Nom</th>
            <th>Date de début</th>
            <th>Date de fin</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          {% for groupe in groupes %}
          <tr>
            <td>{{ groupe["nom"] }}</td>
            <td>{{ groupe["date_debut"] }}</td>
            <td>{{ groupe["date_fin"] }}</td>
            <td>
              <a href="{{ url_for('accueil', groupe_id=groupe['id']) }}"
                >Tableau de bord</a
              >
              ·
              <a href="{{ url_for('membres', groupe_id=groupe['id']) }}"
                >Membres</a
              >
              ·
              <a href="{{ url_for('depenses', groupe_id=groupe['id']) }}"
                >Dépenses</a
              >
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </figure>
  </div>
  {% else %}
  <p>Aucun groupe créé pour le moment.</p>
  {% endif %}
</section>

<hr />

<section>
  <h2>Créer un groupe</h2>

  <form method="post" action="{{ url_for('ajouter_groupe') }}">
    <label>
      Nom du groupe
      <input
        type="text"
        name="nom"
        placeholder="Ex : Vacances au Portugal"
        required
      />
    </label>

    <label>
      Date de début
      <input type="date" name="date_debut" required />
    </label>

    <label>
      Date de fin
      <input type="date" name="date_fin" required />
    </label>

    <button type="submit">Créer le groupe</button>
  </form>
</section>

{% endblock %}
